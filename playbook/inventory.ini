# +==============================================================================+
# Inventário - a "lista de telefone" das máquinas
# Os três "hosts" abaixo são a mesma máquina em MOMENTOS diferentes
#
#
#
# A sessão live do void (USB)
# Executa na própria máquina, sem SSH
# +==============================================================================+
[live_host]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# +==============================================================================+
# O sistema que está sendo instalado, DENTRO de '/mnt'
# Roda tudo via `chroot /mnt ...`
# +==============================================================================+
[chroot_host]
void_target ansible_connection=community.general.chroot ansible_host=/mnt ansible_python_interpreter=/usr/bin/python3

# +==============================================================================+
# A máquina já instalada, usada apenas pelo post-boot.yml após o reboot
# +==============================================================================+
[installed_host]
void_system ansible_connection=local ansible_python_interpreter=/usr/bin/python3
