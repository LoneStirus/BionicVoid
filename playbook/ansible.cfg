# +==============================================================================+
# ansible.cfg é lido automáticamente ao rodar o playbook
# +==============================================================================+

[defaults]
inventory             = inventory.ini     # De onde vem a lista de máquinas
collections_path      = ./collections     # Coleções dentro do próprio repositório
stdout_callback       = yaml              # Saída legível (uma linha por módulo)
display_skipped_hosts = False             # Menos ruído ao usar --tags
retry_files_enabled   = False             # Não gerar arquivos .retry
host_key_checking     = False             # Só importa no post-boot.yml (via SSH)
interpreter_python    = auto_silent       # Silencia o aviso de "python descoberto"

[privilege_escalation]
become                = False             # Deixamos desligado de propósito, no live já somos root
